    <script>
        // Stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.width = (2 + Math.random() * 3) + 'px';
            star.style.height = star.style.width;
            starsContainer.appendChild(star);
        }

        // Sakura
        const canvas = document.getElementById('sakuraCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Petal {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width; this.y = -20;
                this.size = 8 + Math.random() * 12; this.speedY = 0.5 + Math.random() * 1.5;
                this.speedX = -0.5 + Math.random() * 1; this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02; this.opacity = 0.3 + Math.random() * 0.5;
                this.wobble = Math.random() * Math.PI * 2; this.wobbleSpeed = 0.02 + Math.random() * 0.03;
            }
            update() {
                this.y += this.speedY; this.wobble += this.wobbleSpeed;
                this.x += this.speedX + Math.sin(this.wobble) * 0.5;
                this.rotation += this.rotationSpeed;
                if (this.y > canvas.height + 20) this.reset();
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity; ctx.fillStyle = '#ffb7c5';
                ctx.beginPath(); ctx.ellipse(0, 0, this.size * 0.6, this.size * 0.3, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ff8fab'; ctx.beginPath(); ctx.ellipse(this.size * 0.2, 0, this.size * 0.4, this.size * 0.2, 0.3, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }

        const petals = Array.from({ length: 15 }, () => { const p = new Petal(); p.y = Math.random() * canvas.height; return p; });
        function animateSakura() { ctx.clearRect(0, 0, canvas.width, canvas.height); petals.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateSakura); }
        animateSakura();

        // Scroll animations
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

        // Sparkle
        let lastSparkle = 0;
        document.addEventListener('mousemove', (e) => {
            const now = Date.now(); if (now - lastSparkle < 80) return; lastSparkle = now;
            const sparkle = document.createElement('div'); sparkle.className = 'sparkle';
            sparkle.style.left = e.clientX - 4 + 'px'; sparkle.style.top = e.clientY - 4 + 'px';
            document.body.appendChild(sparkle); setTimeout(() => sparkle.remove(), 600);
        });

        // Mobile menu
        const menuBtn = document.getElementById('menuBtn');
        const navLinks = document.getElementById('navLinks');
        menuBtn.addEventListener('click', () => { navLinks.classList.toggle('active'); menuBtn.textContent = navLinks.classList.contains('active') ? '✕' : '☰'; });
        navLinks.querySelectorAll('a').forEach(link => { link.addEventListener('click', () => { navLinks.classList.remove('active'); menuBtn.textContent = '☰'; }); });

        // Music controls — click to expand/collapse panel
        const musicControl = document.querySelector('.music-control');
        document.getElementById('musicToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            musicControl.classList.toggle('open');
        });
        document.getElementById('bgmPlayBtn').addEventListener('click', () => {
            if (typeof toggleBGM === 'function') toggleBGM();
        });
        document.getElementById('bgmPrevBtn').addEventListener('click', () => {
            if (typeof prevTrack === 'function') prevTrack();
        });
        document.getElementById('bgmNextBtn').addEventListener('click', () => {
            if (typeof nextTrack === 'function') nextTrack();
        });
    </script>
    <script src="bgm.js"></script>
